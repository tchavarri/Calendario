<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario familiar</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style id="css">
/* VOICE: warm, family, a kitchen-wall calendar that happens to be digital.
   IDEA: the Casaideas wall calendar: green month band, periwinkle weekday row, handwritten marker notes, stickers.
   PICTURE: the month grid itself, filling the screen, readable from across the room.
   COLOUR and TYPE: bottle green band, periwinkle row, white paper; marker inks; Barlow Condensed + Caveat handwriting.
   LAYOUT: grid fills the screen; side column (today + shopping) in landscape, below in portrait. */
:root{--bg:#e9ece8;--paper:#fff;--ink:#1f2a24;--grid:#3a4250;--muted:#6b756f;--green:#2f5e4b;--peri:#6d84d6;--soft:#f3f5f2;
--c-morado:#7b2fa8;--c-verde:#1d8048;--c-azul:#1f5fbf;--c-rojo:#cf3434;--c-rosado:#d8508f;--c-celeste:#3a9bd0;--c-naranjo:#d8701f;--c-negro:#2b2b2b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1412;--paper:#1a211d;--ink:#e7ece9;--grid:#3d4a44;--muted:#9aa69f;--green:#2b5644;--peri:#4d63b3;--soft:#202824;
--c-morado:#c993f2;--c-verde:#6ad49a;--c-azul:#7fb0ff;--c-rojo:#ff8a85;--c-rosado:#ff94c4;--c-celeste:#7fd0f5;--c-naranjo:#ffb070;--c-negro:#dfe3e0}}
:root[data-theme=dark]{--bg:#0f1412;--paper:#1a211d;--ink:#e7ece9;--grid:#3d4a44;--muted:#9aa69f;--green:#2b5644;--peri:#4d63b3;--soft:#202824;
--c-morado:#c993f2;--c-verde:#6ad49a;--c-azul:#7fb0ff;--c-rojo:#ff8a85;--c-rosado:#ff94c4;--c-celeste:#7fd0f5;--c-naranjo:#ffb070;--c-negro:#dfe3e0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
.top{display:flex;align-items:center;background:var(--green);color:#fff;padding:10px max(3vw,12px)}
.top h1{flex:1;margin:0;font:700 clamp(30px,5vw,48px)/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase}
.top h1 span{float:right;font-weight:500}
.nav{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:26px;line-height:1}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:0;background:#fff;color:var(--green);font-weight:600}
.sync{font-size:13px;opacity:.85;white-space:nowrap}
.wrap{display:flex;flex-direction:column;padding:12px max(2vw,8px) 24px}
.cal{display:flex;flex-direction:column;height:74vh;min-height:520px;background:var(--paper);border-radius:6px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-gap:4px;gap:4px}
.dow div{background:var(--peri);color:#fff;text-align:center;font:500 clamp(13px,1.9vw,19px)/2 "Barlow Condensed",sans-serif;overflow:hidden;white-space:nowrap}
.grid{flex:1;grid-auto-rows:minmax(0,1fr);margin-top:6px}
.cell{position:relative;display:block;text-align:left;background:var(--paper);border:1.5px solid var(--grid);border-radius:2px;padding:4px 5px;overflow:hidden}
.cell.pad{border-color:transparent;background:transparent}
.cell.we{background:var(--soft)}
.cell.today{box-shadow:inset 0 0 0 3px var(--green)}
.cell.today .num{background:var(--green);color:#fff;border-radius:4px;padding:0 4px}
.num{display:inline-block;font:500 15px/1.3 "Barlow Condensed",sans-serif;color:var(--muted)}
.ev{display:block;margin-top:2px}
.ln{display:block;font:700 clamp(14px,2.1vw,19px)/1.08 Caveat,cursive;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85em}
.done{text-decoration:line-through;opacity:.55}
.stk{display:inline-block;max-width:100%;padding:1px 6px;margin:1px 0;border-radius:3px;font:500 12px/1.4 "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.c-morado{color:var(--c-morado)}.c-verde{color:var(--c-verde)}.c-azul{color:var(--c-azul)}.c-rojo{color:var(--c-rojo)}.c-rosado{color:var(--c-rosado)}.c-celeste{color:var(--c-celeste)}.c-naranjo{color:var(--c-naranjo)}.c-negro{color:var(--c-negro)}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));grid-gap:14px;gap:14px;align-content:start}
.card{background:var(--paper);border-radius:6px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card h2{margin:0 0 8px;font:700 24px/1.1 "Barlow Condensed",sans-serif;color:var(--green)}
:root[data-theme=dark] .card h2{color:#8fd1b0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .card h2{color:#8fd1b0}}
.card h3{margin:12px 0 4px;font:600 15px/1.2 Barlow,sans-serif;color:var(--muted)}
.card ul{list-style:none;margin:0;padding:0}
.agenda li{padding:3px 0}
.agenda .ln{white-space:normal;font-size:22px}
.empty{color:var(--muted)}
.buy li button{display:flex;align-items:center;width:100%;min-height:44px;border:0;background:none;text-align:left;font:700 22px/1.1 Caveat,cursive;color:var(--c-morado)}
.buy .box{flex:none;width:24px;height:24px;border:2px solid currentColor;border-radius:4px;font:700 16px/20px Barlow,sans-serif;text-align:center}
.addrow{display:flex;margin-bottom:6px}
.addrow input,.sheet input{flex:1;min-height:44px;font-size:16px;padding:8px 10px;border:1.5px solid var(--grid);border-radius:6px;background:var(--paper)}
.primary{min-height:44px;padding:0 18px;border:0;border-radius:6px;background:var(--green);color:#fff;font-weight:600}
.ghost,.link{min-height:44px;padding:0 14px;border:1.5px solid var(--grid);border-radius:6px;background:none}
.link{margin-top:8px;font-size:14px;color:var(--muted)}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,20,15,.45);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--paper);border-radius:10px;padding:16px 18px 20px}
.sh-h{display:flex;align-items:center}
.sh-h h2{flex:1;margin:0;font:700 28px/1.1 "Barlow Condensed",sans-serif;color:var(--green)}
.x{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);font-size:18px}
.dlist{list-style:none;padding:0;margin:12px 0}
.dlist li{display:flex;align-items:center;padding:4px 0;border-bottom:1px dashed var(--grid)}
.dlist .et{flex:1;min-height:44px;text-align:left;border:0;background:none;padding:2px 0}
.dlist .et .ln{white-space:normal;font-size:23px}
.chk{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--grid);background:none;color:transparent;font-weight:700}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.del{flex:none;min-height:36px;padding:0 10px;border:0;border-radius:6px;background:var(--soft);font-size:14px;color:var(--c-rojo)}
.lab{margin:12px 0 6px;font-size:14px;font-weight:600;color:var(--muted)}
.f2{display:flex;align-items:flex-end}
.f2 label{display:flex;flex-direction:column;font-size:14px;font-weight:600;color:var(--muted)}
.f2 label:first-child{flex:1}
.f2 input[type=time]{width:120px}
.dots{display:flex;flex-wrap:wrap;margin:-4px}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid transparent;background:currentColor}
.dot.sel{border-color:var(--paper);box-shadow:0 0 0 3px currentColor}
.stks{display:flex;flex-wrap:wrap;margin:-3px}
.stks button{border:2px solid transparent;font-size:15px;padding:6px 10px;border-radius:5px;min-height:38px}
.stks button.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.stks .none{background:var(--soft);color:var(--ink)}
.row{display:flex;margin-top:16px}
@media (min-width:900px) and (orientation:landscape){.wrap .side{margin:0 0 0 14px}.wrap{flex-direction:row;height:calc(100vh - 68px)}.cal{flex:1;height:auto}.side{width:300px;flex:none;grid-template-columns:1fr;overflow:auto}}
@media (max-width:600px){.cal{height:auto;min-height:0;padding:4px}.grid{grid-auto-rows:84px;grid-gap:2px;gap:2px}.dow{grid-gap:2px;gap:2px}.cell{padding:2px 3px}.ln{font-size:13px}.stk{font-size:10px;padding:0 3px}.top h1 span{display:none}.sync{display:none}}
.top>*+*{margin-left:10px}.side{margin-top:14px}.buy .box{margin-right:10px}.addrow>*+*{margin-left:8px}.sh-h>*+*,.dlist li>*+*{margin-left:8px}.f2>*+*,.row>*+*{margin-left:10px}.dots>*{margin:4px}.stks>*{margin:3px}
.backup{width:100%;min-height:140px;font:13px/1.4 monospace;padding:8px;border:1.5px solid var(--grid);border-radius:6px;background:var(--paper);color:var(--ink)}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}

  const e=editId?S.ev.find(x=>x.id===editId):null,l=evsOf(day);
  modal.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sh-h"><h2 id="mt">'+fecha(day)+'</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div>'+
  '<ul class="dlist">'+(l.length?l.map(x=>'<li><button class="chk'+(x.x?' on':'')+'" data-a="done" data-id="'+esc(x.id)+'" aria-label="Marcar como hecho">✓</button><button class="et" data-a="edit" data-id="'+esc(x.id)+'">'+line(x)+'</button><button class="del" data-a="del" data-id="'+esc(x.id)+'">Borrar</button></li>').join(''):'<li class="empty">Nada anotado todavía.</li>')+'</ul>'+
  '<form id="evf"><div class="f2"><label>'+(e?'Editar':'Anotar')+'<input id="et" autocomplete="off" placeholder="Ej: Reunión de apoderados" value="'+esc(e?e.t:'')+'"></label><label>Hora<input id="eh" type="time" value="'+esc(e&&e.h||'')+'"></label></div>'+
  '<div class="lab">Color del plumón</div><div class="dots">'+COL.map(c=>'<button type="button" class="dot c-'+c[0]+(c[0]===selC?' sel':'')+'" data-a="color" data-c="'+c[0]+'" aria-label="'+c[1]+'"></button>').join('')+'</div>'+
  '<div class="lab">Adhesivo</div><div class="stks"><button type="button" class="none'+(!selS?' sel':'')+'" data-a="stk" data-s="">Sin adhesivo</button>'+Object.keys(ST).map(s=>'<button type="button" data-a="stk" data-s="'+s+'" class="'+(s===selS?'sel':'')+'" style="background:'+ST[s][1]+';color:'+ST[s][2]+'">'+ST[s][0]+'</button>').join('')+'</div>'+
  '<div class="row"><button class="primary" type="submit">'+(e?'Guardar cambios':'Agregar')+'</button>'+(e?'<button type="button" class="ghost" data-a="cancel">Cancelar</button>':'')+'</div></form></div>';
}
function closeModal(){modal.hidden=true;modal.innerHTML='';day=null;editId=null}
function save(){try{localStorage.setItem('calfam',JSON.stringify(S))}catch(e){}}
function rerender(){render();if(day&&day!=='bk')renderModal()}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b){if(ev.target===modal)closeModal();return}
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='prev'||a==='next'){view.m+=a==='next'?1:-1;if(view.m<0){view.m=11;view.y--}if(view.m>11){view.m=0;view.y++}try{sessionStorage.setItem('calfam-view',JSON.stringify(view))}catch(e){}render()}
  else if(a==='hoy'){const t=new Date();view={y:t.getFullYear(),m:t.getMonth()};try{sessionStorage.removeItem('calfam-view')}catch(e){}render()}
  else if(a==='open')openDay(b.dataset.d);
  else if(a==='close')closeModal();
  else if(a==='color'){selC=b.dataset.c;modal.querySelectorAll('.dot').forEach(d=>d.classList.toggle('sel',d===b))}
  else if(a==='stk'){selS=b.dataset.s;modal.querySelectorAll('.stks button').forEach(d=>d.classList.toggle('sel',d===b))}
  else if(a==='done'){const e=S.ev.find(x=>x.id===id);if(e){e.x=!e.x;save();rerender()}}
  else if(a==='del'){S.ev=S.ev.filter(x=>x.id!==id);if(editId===id)editId=null;save();rerender()}
  else if(a==='edit'){const e=S.ev.find(x=>x.id===id);if(e){editId=id;selC=col(e.c);selS=ST[e.s]?e.s:'';renderModal();const i=document.getElementById('et');if(i)i.focus()}}
  else if(a==='cancel'){editId=null;selC='morado';selS='';renderModal()}
  else if(a==='buy'){const x=S.buy.find(z=>z.id===id);if(x){x.x=!x.x;save();render()}}
  else if(a==='bk'){day='bk';modal.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sh-h"><h2 id="mt">Respaldo</h2><button class="x" data-a="close" aria-label="Cerrar">✕</button></div><p class="note">Todo queda guardado solo en este equipo. De vez en cuando copia este texto y guárdalo en Notas. Para recuperar, pega aquí un respaldo y toca Restaurar.</p><textarea id="bkt" class="backup" aria-label="Respaldo"></textarea><div class="row"><button type="button" class="ghost" data-a="bksel">Seleccionar todo</button><button type="button" class="primary" data-a="bkres">Restaurar</button></div><p class="note" id="bkm"></p></div>';document.getElementById('bkt').value=JSON.stringify(S);modal.hidden=false}
  else if(a==='bksel'){const t=document.getElementById('bkt');t.focus();t.setSelectionRange(0,t.value.length)}
  else if(a==='bkres'){const m=document.getElementById('bkm');try{const v=JSON.parse(document.getElementById('bkt').value);if(!v||!Array.isArray(v.ev)||!Array.isArray(v.buy))throw 0;S=v;save();render();m.textContent='Listo, respaldo restaurado.'}catch(e){m.textContent='Ese texto no es un respaldo válido.'}}
  else if(a==='clean'){S.buy=S.buy.filter(z=>!z.x);save();render()}
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  if(ev.target.id==='buyf'){const i=document.getElementById('buyin'),t=i.value.trim();if(t){S.buy.push({id:uid(),t:t});save();render();const n=document.getElementById('buyin');if(n)n.focus()}return}
  if(ev.target.id==='evf'){const t=document.getElementById('et').value.trim(),h=document.getElementById('eh').value;if(!t&&!selS)return;
    if(editId){const e=S.ev.find(x=>x.id===editId);if(e){e.t=t;e.h=h;e.c=selC;e.s=selS}}else S.ev.push({id:uid(),d:day,t:t,h:h,c:selC,s:selS});
    editId=null;save();render();renderModal();}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&day)closeModal();else if(!day&&ev.target.tagName!=='INPUT'){if(ev.key==='ArrowLeft')document.querySelector('[data-a=prev]').click();if(ev.key==='ArrowRight')document.querySelector('[data-a=next]').click()}});
let lastDay=todayK();setInterval(()=>{if(todayK()!==lastDay){lastDay=todayK();render()}},60000);
render();
try{const l=JSON.parse(localStorage.getItem('calfam')||'null');if(l&&l.ev)S=l}catch(e){}
render();
}</script></body></html>
